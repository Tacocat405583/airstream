[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airstream"
version = "0.1.0"
description = "Real-time weather + flight pipeline (NWS + OpenSky) over Kafka"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/airstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
